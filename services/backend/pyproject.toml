[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-fitness-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "competitive-fitness-contracts==1.0.0",
    "pydantic-settings>=2.6,<3",
    "SQLAlchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "PyJWT>=2.10.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../packages/contracts/tests", "../../packages/exercise_engine/tests"]
pythonpath = [".", "../..", "../../packages/exercise_engine/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "packages", "exercise_engine"]
