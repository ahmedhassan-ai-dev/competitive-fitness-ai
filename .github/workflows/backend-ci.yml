name: Backend CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: services/backend
        run: pip install -e '.[dev]'
      - name: Run tests
        working-directory: services/backend
        run: python -m pytest -q
      - name: Lint backend and shared reference packages
        run: python -m ruff check --config services/backend/pyproject.toml services/backend/app services/backend/tests packages/contracts packages/exercise_engine
